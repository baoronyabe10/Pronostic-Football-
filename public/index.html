<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronostics buts</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#16a34a">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#16202a;--muted:#667585;--accent:#16a34a;--border:#e1e6eb;--chip:#e8edf2;--h:#2563eb;--d:#94a3b8;--a:#f59e0b;--ok:#16a34a;--ko:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--text:#eaf0f6;--muted:#93a3b3;--accent:#4ade80;--border:#2a3745;--chip:#223040;--ok:#4ade80;--ko:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.35rem;margin:6px 0 2px}
h2{font-size:.95rem;color:var(--muted);text-transform:capitalize;margin:18px 0 8px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px;border-radius:10px;font-size:.95rem;cursor:pointer}
.tab.on{background:var(--accent);color:#06210f;font-weight:700;border-color:var(--accent)}
input[type=search]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--text);padding:7px 13px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--accent);color:#06210f;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}
.teams{font-weight:650;font-size:1.02rem;margin:6px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{background:var(--chip);border-radius:8px;padding:4px 9px;font-size:.82rem}
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-bottom:4px}
.bar span:nth-child(1){background:var(--h)}.bar span:nth-child(2){background:var(--d)}.bar span:nth-child(3){background:var(--a)}
.legend{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.picks{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:6px 0 4px}
.picks h3{margin:0 0 8px;font-size:1rem}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);cursor:pointer}
.prow:first-of-type{border-top:0}
.prow small{display:block;color:var(--muted);font-size:.76rem}
.prow b.pct{font-size:1.1rem;color:var(--accent)}
.note{color:var(--muted);font-size:.8rem;text-align:center;margin-top:20px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.panel h3{margin:0 0 2px;font-size:1.15rem}
.close{float:right;border:0;background:var(--chip);color:var(--text);border-radius:999px;width:34px;height:34px;font-size:1.1rem;cursor:pointer}
.sec{font-size:.85rem;color:var(--muted);margin:16px 0 6px;font-weight:600}
.srow{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:8px;margin:5px 0;font-size:.9rem}
.sbar{height:12px;border-radius:6px;background:var(--chip);overflow:hidden}
.sbar span{display:block;height:100%;background:var(--accent)}
.badges{display:flex;gap:5px;margin:4px 0}
.badge{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:.82rem;color:#fff}
.badge.V{background:#16a34a}.badge.N{background:#94a3b8}.badge.D{background:#dc2626}
.fline{font-size:.8rem;color:var(--muted)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--border)}
.stat:first-of-type{border-top:0}
.stat b{font-size:1.2rem;color:var(--accent)}
.res{display:flex;justify-content:space-between;font-size:.88rem;padding:7px 0;border-top:1px solid var(--border)}
.ok{color:var(--ok)}.ko{color:var(--ko)}
#install{display:none;margin:0 0 10px;width:100%}
</style>
</head>
<body>
<main>
  <h1>Pronostics buts</h1>
  <p class="sub" id="upd">Chargement…</p>
  <button class="chip on" id="install">Installer l’application sur l’écran d’accueil</button>
  <div class="tabs">
    <button class="tab on" id="t-pron">Pronostics</button>
    <button class="tab" id="t-bilan">Bilan</button>
  </div>
  <input type="search" id="q" placeholder="Rechercher une équipe (PSG, Arsenal…)">
  <div id="view"></div>
  <p class="note">Estimations statistiques (modèle de Poisson) : elles ne garantissent rien. Si vous pariez, ne misez jamais d’argent dont vous avez besoin.</p>
</main>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pc(x){return Math.round(x*100)+' %'}
function fr(x){return String(x).replace('.',',')}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function dayLabel(d){return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function hour(d){return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}

var data=[],past=null,view='pron',filter='ALL',query='',pick='over';

/* ---------- Carte d'un match ---------- */
function card(m){
  var d=new Date(m.utc_date),c=el('div','card');
  c.onclick=function(){openDetail(m)};
  var meta=el('div','meta');meta.appendChild(el('span',null,m.competition_name));meta.appendChild(el('span',null,hour(d)));
  c.appendChild(meta);
  c.appendChild(el('div','teams',m.home+' – '+m.away));
  var pills=el('div','pills');
  var tot=Math.round((Number(m.xg_home)+Number(m.xg_away))*10)/10;
  [['Buts attendus',fr(tot)],['+2,5 buts',pc(m.p_over25)],['Les 2 marquent',pc(m.p_btts)],['Score probable',m.score]].forEach(function(p){
    var s=el('span','pill',p[0]+' ');s.appendChild(el('b',null,p[1]));pills.appendChild(s)});
  c.appendChild(pills);
  c.appendChild(bar(m));
  var lg=el('div','legend');
  lg.appendChild(el('span',null,'Dom. '+pc(m.p_home)));lg.appendChild(el('span',null,'Nul '+pc(m.p_draw)));lg.appendChild(el('span',null,'Ext. '+pc(m.p_away)));
  c.appendChild(lg);
  return c;
}
function bar(m){
  var b=el('div','bar');
  [m.p_home,m.p_draw,m.p_away].forEach(function(p){var s=document.createElement('span');s.style.width=(p*100)+'%';b.appendChild(s)});
  return b;
}

/* ---------- Vue Pronostics ---------- */
function renderPron(){
  var root=$('view');root.innerHTML='';
  if(!data.length){root.appendChild(el('p','empty','Aucun pronostic pour le moment.'));return}
  var q=norm(query.trim());

  if(!q){
    var box=el('div','picks');
    box.appendChild(el('h3',null,'Matchs à retenir'));
    var chips=el('div','chips');
    [['over','Plus de 2,5 buts'],['btts','Les 2 équipes marquent']].forEach(function(o){
      var b=el('button','chip'+(pick===o[0]?' on':''),o[1]);
      b.onclick=function(){pick=o[0];renderPron()};chips.appendChild(b)});
    box.appendChild(chips);
    var key=pick==='over'?'p_over25':'p_btts';
    data.slice().sort(function(a,b){return b[key]-a[key]}).slice(0,5).forEach(function(m){
      var r=el('div','prow'),l=el('div');
      l.appendChild(el('span',null,m.home+' – '+m.away));
      l.appendChild(el('small',null,m.competition_name+' · '+dayLabel(new Date(m.utc_date))+' '+hour(new Date(m.utc_date))));
      r.appendChild(l);r.appendChild(el('b','pct',pc(m[key])));
      r.onclick=function(){openDetail(m)};box.appendChild(r)});
    root.appendChild(box);
  }

  var comps=[['ALL','Tous']];
  data.forEach(function(m){if(!comps.some(function(c){return c[0]===m.competition}))comps.push([m.competition,m.competition_name])});
  var cb=el('div','chips');cb.style.marginTop='10px';
  comps.forEach(function(c){var b=el('button','chip'+(filter===c[0]?' on':''),c[1]);b.onclick=function(){filter=c[0];renderPron()};cb.appendChild(b)});
  root.appendChild(cb);

  var rows=data.filter(function(m){
    return (filter==='ALL'||m.competition===filter)&&(!q||norm(m.home).indexOf(q)>-1||norm(m.away).indexOf(q)>-1)});
  if(!rows.length){root.appendChild(el('p','empty','Aucun match trouvé.'));return}
  var last='';
  rows.forEach(function(m){
    var day=dayLabel(new Date(m.utc_date));
    if(day!==last){root.appendChild(el('h2',null,day));last=day}
    root.appendChild(card(m));
  });
}

/* ---------- Détail d'un match ---------- */
function formBlock(name,arr){
  var w=el('div');w.appendChild(el('div','fline',name));
  if(!arr||!arr.length){w.appendChild(el('div','fline','Disponible après la prochaine mise à jour.'));return w}
  var b=el('div','badges');arr.forEach(function(x){b.appendChild(el('span','badge '+x.r,x.r))});w.appendChild(b);
  arr.slice().reverse().forEach(function(x){w.appendChild(el('div','fline',x.r+' '+x.s+' vs '+x.o+(x.h?' (dom.)':' (ext.)')))});
  return w;
}
function openDetail(m){
  var p=$('panel');p.innerHTML='';
  var x=el('button','close','×');x.onclick=closeDetail;p.appendChild(x);
  p.appendChild(el('h3',null,m.home+' – '+m.away));
  var d=new Date(m.utc_date);
  p.appendChild(el('div','sub',m.competition_name+' · '+dayLabel(d)+' '+hour(d)));
  var pills=el('div','pills');
  [['Buts attendus',fr(m.xg_home)+' – '+fr(m.xg_away)],['+2,5 buts',pc(m.p_over25)],['Les 2 marquent',pc(m.p_btts)]].forEach(function(a){
    var s=el('span','pill',a[0]+' ');s.appendChild(el('b',null,a[1]));pills.appendChild(s)});
  p.appendChild(pills);
  p.appendChild(el('div','sec','Résultat (1N2)'));
  p.appendChild(bar(m));
  var lg=el('div','legend');
  lg.appendChild(el('span',null,m.home+' '+pc(m.p_home)));lg.appendChild(el('span',null,'Nul '+pc(m.p_draw)));lg.appendChild(el('span',null,m.away+' '+pc(m.p_away)));
  p.appendChild(lg);
  p.appendChild(el('div','sec','Scores les plus probables'));
  var sc=m.scores||[];
  if(sc.length){var mx=sc[0].p;sc.forEach(function(s){
    var r=el('div','srow');r.appendChild(el('span',null,s.s));
    var sb=el('div','sbar'),f=document.createElement('span');f.style.width=(s.p/mx*100)+'%';sb.appendChild(f);r.appendChild(sb);
    r.appendChild(el('span',null,pc(s.p)));p.appendChild(r)})}
  else p.appendChild(el('div','fline','Disponible après la prochaine mise à jour.'));
  p.appendChild(el('div','sec','Forme récente (5 derniers matchs)'));
  p.appendChild(formBlock(m.home,m.form_home));
  var sp=el('div');sp.style.height='10px';p.appendChild(sp);
  p.appendChild(formBlock(m.away,m.form_away));
  p.appendChild(el('div','sec','Fiabilité'));
  p.appendChild(el('div','fline','Données disponibles : '+m.confidence));
  $('sheet').classList.add('show');
}
function closeDetail(){$('sheet').classList.remove('show')}
$('sheet').onclick=function(e){if(e.target===$('sheet'))closeDetail()};

/* ---------- Vue Bilan ---------- */
function renderBilan(){
  var root=$('view');root.innerHTML='';
  if(past===null){root.appendChild(el('p','empty','Chargement…'));return}
  if(!past.length){root.appendChild(el('p','empty','Pas encore de match terminé avec un pronostic. Le bilan se remplit après les premiers matchs et la mise à jour suivante.'));return}
  var n=past.length,o=0,b=0,x=0,s=0;
  past.forEach(function(m){
    var rh=m.result_home,ra=m.result_away;
    if((m.p_over25>=0.5)===(rh+ra>2))o++;
    if((m.p_btts>=0.5)===(rh>0&&ra>0))b++;
    var pr=m.p_home>=m.p_draw&&m.p_home>=m.p_away?'H':(m.p_away>=m.p_draw?'A':'D');
    if(pr===(rh>ra?'H':rh<ra?'A':'D'))x++;
    if(m.score===rh+'-'+ra)s++;
  });
  var box=el('div','picks');
  box.appendChild(el('h3',null,'Réussite sur '+n+' matchs terminés'));
  [['Plus/moins de 2,5 buts',o],['Les 2 équipes marquent',b],['Résultat (1N2)',x],['Score exact',s]].forEach(function(r){
    var row=el('div','stat');row.appendChild(el('span',null,r[0]));
    row.appendChild(el('b',null,Math.round(r[1]/n*100)+' % ('+r[1]+'/'+n+')'));box.appendChild(row)});
  root.appendChild(box);
  if(n<30)root.appendChild(el('p','note','Moins de 30 matchs : ces pourcentages sont encore peu fiables.'));
  root.appendChild(el('h2',null,'Derniers matchs'));
  var list=el('div','picks');
  past.slice(0,15).forEach(function(m){
    var ok=(m.p_over25>=0.5)===(m.result_home+m.result_away>2);
    var r=el('div','res');
    var l=el('span',null,m.home+' – '+m.away);
    var rr=el('span',null,'prévu '+m.score+' · réel '+m.result_home+'-'+m.result_away+' ');
    rr.appendChild(el('b',ok?'ok':'ko',ok?'✓':'✗'));
    r.appendChild(l);r.appendChild(rr);list.appendChild(r)});
  root.appendChild(list);
  root.appendChild(el('p','note','✓ = le pronostic « plus/moins de 2,5 buts » était juste.'));
}

/* ---------- Navigation ---------- */
function show(v){
  view=v;
  $('t-pron').classList.toggle('on',v==='pron');$('t-bilan').classList.toggle('on',v==='bilan');
  $('q').style.display=v==='pron'?'':'none';
  if(v==='pron')renderPron();
  else{
    renderBilan();
    if(past===null)fetch('/api/predictions?past=1').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){past=rows;if(view==='bilan')renderBilan()}).catch(function(){past=[];renderBilan()});
  }
}
$('t-pron').onclick=function(){show('pron')};
$('t-bilan').onclick=function(){show('bilan')};
$('q').addEventListener('input',function(){query=this.value;renderPron()});

fetch('/api/predictions').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
  data=rows;
  if(rows.length){var u=rows.map(function(m){return m.updated_at}).sort().pop();
    $('upd').textContent='Mis à jour le '+new Date(u).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
  else $('upd').textContent='Aucun pronostic pour l’instant.';
  show('pron');
}).catch(function(){$('upd').textContent='Impossible de charger les pronostics.'});

/* ---------- Installation (PWA) ---------- */
var deferred=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('install').style.display='block'});
$('install').onclick=function(){if(deferred){deferred.prompt();deferred=null;$('install').style.display='none'}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
</script>
</body>
</html>
